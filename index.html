<!DOCTYPE html>
<html>
<head>
    <title>Prim's Algorithm MST Visualizer</title>


    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 90%;
            max-width: 900px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 100%;
        }
        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        #addNode {
            background-color: #3498db;
            color: white;
        }
        #addEdge {
            background-color: #2ecc71;
            color: white;
        }
        #findMST {
            background-color: #e74c3c;
            color: white;
        }
        #clear {
            background-color: #f39c12;
            color: white;
        }
        button:hover {
            opacity: 0.9;
        }
        .weight-container {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #weight {
            width: 50px;
            padding: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        canvas {
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .solution {
            width: 100%;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .solution h3 {
            margin-top: 0;
            color: #2c3e50;
        }
        .solution-steps {
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Prim's Algorithm MST Visualizer</div>
        
        <div class="controls">
            <button id="addNode">Add Node</button>
            <button id="addEdge">Add Edge</button>
            <button id="findMST">Find MST</button>
            <button id="clear">Clear</button>
            <div class="weight-container">
                <span>Weight:</span>
                <input id="weight" type="number" value="1" min="1">
            </div>
        </div>
        
        <canvas id="graphCanvas" width="800" height="500"></canvas>
        
        <div class="solution">
            <h3>Solution Steps:</h3>
            <div class="solution-steps" id="solutionSteps">
                <p>Click "Add Node" to place nodes on the canvas</p>
                <p>Click "Add Edge" then select two nodes to connect them</p>
                <p>Set edge weight before creating connections</p>
                <p>Click "Find MST" to visualize Prim's algorithm</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const nodeRadius = 15;
        const solutionSteps = document.getElementById('solutionSteps');
        
        let nodes = [];
        let edges = [];
        let mstEdges = [];
        let selectedNode = null;
        let mode = 'none';

        document.getElementById('addNode').addEventListener('click', () => {
            mode = 'addNode';
            addSolutionStep("Add Node mode: Click on canvas to add nodes");
        });
        document.getElementById('addEdge').addEventListener('click', () => {
            if (nodes.length < 2) {
                addSolutionStep("Need at least 2 nodes to add edges", true);
                return;
            }
            mode = 'addEdge';
            selectedNode = null;
            addSolutionStep("Add Edge mode: Select first node");
        });
        document.getElementById('findMST').addEventListener('click', findMST);
        document.getElementById('clear').addEventListener('click', clearCanvas);

        canvas.addEventListener('click', handleCanvasClick);

        function handleCanvasClick(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (mode === 'addNode') {
                addNode(x, y);
            } else if (mode === 'addEdge') {
                handleEdgeCreation(x, y);
            }
            drawGraph();
        }

        function addNode(x, y) {
            // Check if position is occupied
            for (const node of nodes) {
                const dist = Math.sqrt((node.x - x) ** 2 + (node.y - y) ** 2);
                if (dist < 2 * nodeRadius) {
                    addSolutionStep("Nodes are too close together", true);
                    return;
                }
            }
            
            const newNode = { id: nodes.length + 1, x, y };
            nodes.push(newNode);
            addSolutionStep(`Added Node ${newNode.id} at (${Math.round(x)}, ${Math.round(y)})`);
        }

        function handleEdgeCreation(x, y) {
            const clickedNode = getNodeAtPosition(x, y);
            if (!clickedNode) return;

            if (!selectedNode) {
                selectedNode = clickedNode;
                addSolutionStep(`Selected Node ${selectedNode.id} as first endpoint`);
            } else {
                if (selectedNode === clickedNode) {
                    addSolutionStep("Cannot create edge to the same node", true);
                    selectedNode = null;
                    return;
                }
                
                const weight = parseInt(document.getElementById('weight').value) || 1;
                edges.push({ from: selectedNode, to: clickedNode, weight });
                addSolutionStep(`Created edge between Node ${selectedNode.id} and Node ${clickedNode.id} with weight ${weight}`);
                selectedNode = null;
            }
            drawGraph();
        }

        function getNodeAtPosition(x, y) {
            for (const node of nodes) {
                const dist = Math.sqrt((node.x - x) ** 2 + (node.y - y) ** 2);
                if (dist <= nodeRadius) return node;
            }
            return null;
        }

        function findMST() {
            if (nodes.length < 2) {
                addSolutionStep("Need at least 2 nodes to find MST", true);
                return;
            }

            solutionSteps.innerHTML = "<p>Running Prim's Algorithm...</p>";
            
            // Prim's algorithm implementation
            const visited = new Set();
            mstEdges = [];
            
            // Start with first node
            visited.add(nodes[0].id);
            addSolutionStep(`Starting Prim's algorithm with Node ${nodes[0].id}`);
            
            while (visited.size < nodes.length) {
                let minEdge = null;
                
                // Find minimum edge connecting visited to unvisited
                for (const edge of edges) {
                    const fromVisited = visited.has(edge.from.id);
                    const toVisited = visited.has(edge.to.id);
                    
                    if (fromVisited !== toVisited) {
                        if (!minEdge || edge.weight < minEdge.weight) {
                            minEdge = edge;
                        }
                    }
                }
                
                if (minEdge) {
                    mstEdges.push(minEdge);
                    const newNode = visited.has(minEdge.from.id) ? minEdge.to : minEdge.from;
                    visited.add(newNode.id);
                    addSolutionStep(`Added edge (${minEdge.from.id}-${minEdge.to.id}, weight: ${minEdge.weight}) to MST`);
                    addSolutionStep(`Added Node ${newNode.id} to visited set`);
                } else {
                    addSolutionStep("No more edges to consider - graph may be disconnected", true);
                    break;
                }
            }
            
            // Calculate total weight
            const totalWeight = mstEdges.reduce((sum, edge) => sum + edge.weight, 0);
            addSolutionStep(`MST complete! Total weight: ${totalWeight}`);
            
            drawGraph();
        }

        function drawGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw edges
            for (const edge of edges) {
                const isMST = mstEdges.some(e => 
                    (e.from === edge.from && e.to === edge.to) || 
                    (e.from === edge.to && e.to === edge.from));
                
                ctx.beginPath();
                ctx.moveTo(edge.from.x, edge.from.y);
                ctx.lineTo(edge.to.x, edge.to.y);
                ctx.strokeStyle = isMST ? '#e74c3c' : '#95a5a6';
                ctx.lineWidth = isMST ? 3 : 1;
                ctx.stroke();
                
                // Draw weight
                const midX = (edge.from.x + edge.to.x) / 2;
                const midY = (edge.from.y + edge.to.y) / 2;
                ctx.fillStyle = '#e74c3c';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(edge.weight, midX, midY);
            }
            
            // Draw nodes
            for (const node of nodes) {
                ctx.beginPath();
                ctx.arc(node.x, node.y, nodeRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#3498db';
                ctx.fill();
                ctx.strokeStyle = '#2980b9';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.fillStyle = 'white';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(node.id, node.x, node.y);
            }
            
            // Highlight selected node
            if (selectedNode) {
                ctx.beginPath();
                ctx.arc(selectedNode.x, selectedNode.y, nodeRadius + 3, 0, Math.PI * 2);
                ctx.strokeStyle = '#f39c12';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        function clearCanvas() {
            nodes = [];
            edges = [];
            mstEdges = [];
            selectedNode = null;
            solutionSteps.innerHTML = `
                <p>Graph cleared</p>
                <p>Click "Add Node" to place nodes on the canvas</p>
                <p>Click "Add Edge" then select two nodes to connect them</p>
                <p>Set edge weight before creating connections</p>
                <p>Click "Find MST" to visualize Prim's algorithm</p>
            `;
            drawGraph();
        }

        function addSolutionStep(message, isWarning = false) {
            const step = document.createElement('p');
            step.textContent = message;
            step.style.color = isWarning ? '#e74c3c' : '#2c3e50';
            step.style.margin = '5px 0';
            solutionSteps.appendChild(step);
            solutionSteps.scrollTop = solutionSteps.scrollHeight;
        }

        // Initial draw
        drawGraph();
    </script>
</body>
</html>
